  <title id="haya-full-2-light-title">Haya Twin rails — full, light</title>
  <desc id="haya-full-2-light-desc">Two parallel, forward-slanting rails pair terminal and database work; the shorter accent rail adds a restrained sense of motion. At 16 px, two broad, separated slashes retain their different lengths and forward lean. Haya is set in Inter at weight 650 and outlined for consistent rendering.</desc>
