<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 296 146" role="img" aria-labelledby="t">
  <title id="t">Haya</title>
  <!-- Haya wordmark. Haya (速) means fast. h, a, a are plain: one 16-unit weight, flat cuts, round bowls.
       The y alone carries the meaning: one quick brush stroke, thick at the top and tapering to its tail,
       which also reads as a check mark (done). Dark backgrounds, with the y in the gold accent. -->
  <g fill="none" stroke="#e6edf5" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M8 0 L8 100"/>
    <path d="M8 70 C8 52 20 44 36 44 C52 44 60 52 60 68 L60 100"/>
    <circle cx="108" cy="68" r="22"/>
    <path d="M130 36 L130 100"/>
    <circle cx="262" cy="68" r="22"/>
    <path d="M284 36 L284 100"/>
  </g>
  <g fill="#cbaa70">
    <path d="M205 36 L223 36 C214 80 197 119 154 142 C187 113 199 79 205 36 Z"/>
    <path d="M150 36 L166 36 L196 92 L188 103 Z"/>
  </g>
</svg>
