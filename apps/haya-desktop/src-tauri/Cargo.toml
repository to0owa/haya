[package]
name = "haya"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "haya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
haya-db = { path = "../../../crates/haya-db" }
haya-pty = { path = "../../../crates/haya-pty" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
webp-animation = { version = "0.10.0", features = ["static"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Used to turn Apple's Writing Tools off for the web view. Both are already in the build through wry.
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
